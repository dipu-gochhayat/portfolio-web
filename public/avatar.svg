<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#131e38" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Ambient light -->
  <circle cx="200" cy="180" r="140" fill="url(#glowGrad)" filter="url(#glow)" />
  <circle cx="200" cy="180" r="100" fill="#6366f1" fill-opacity="0.1" />

  <!-- Tech grid lines -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="480" />
    <line x1="120" y1="0" x2="120" y2="480" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="280" y1="0" x2="280" y2="480" />
    <line x1="360" y1="0" x2="360" y2="480" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="0" y1="400" x2="400" y2="400" />
  </g>

  <!-- Futuristic Badge Border -->
  <circle cx="200" cy="190" r="82" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" filter="url(#glow)" />
  <circle cx="200" cy="190" r="76" fill="#090d16" stroke="#1e293b" stroke-width="2" />

  <!-- Monogram Initials DG -->
  <text x="200" y="206" font-family="'JetBrains Mono', 'Plus Jakarta Sans', monospace, sans-serif" font-size="44" font-weight="800" text-anchor="middle" fill="#f8fafc" letter-spacing="1">
    DG
  </text>

  <!-- Name & Title Pill below avatar -->
  <rect x="70" y="300" width="260" height="42" rx="21" fill="#0c1426" stroke="#334155" stroke-width="1.5" />
  <text x="200" y="326" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#38bdf8" letter-spacing="0.5">
    Dipu Gochhayat
  </text>

  <rect x="95" y="354" width="210" height="28" rx="14" fill="#1e1b4b" fill-opacity="0.6" stroke="#4338ca" stroke-width="1" />
  <text x="200" y="372" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#a5b4fc">
    Java • Backend • CyberSec
  </text>

  <!-- Status indicator -->
  <circle cx="106" cy="420" r="4" fill="#34d399" filter="url(#glow)" />
  <text x="120" y="424" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#94a3b8">
    NIT Bhubaneswar • 2028
  </text>
</svg>
